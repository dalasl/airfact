# ============================================
# 第3章：敏感数据智能分级模块配置
# ============================================

# --- LLM 推理引擎 ---
llm:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  quantization: "4bit"          # GPTQ 4-bit 量化
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  gpu_memory_gb: 4.2            # 预估 VRAM 占用
  inference_latency_s: 1.2      # 单次推理延迟

# --- 敏感等级定义 ---
sensitivity_levels:
  L1:
    name: "公开级"
    description: "公开信息，无限制"
  L2:
    name: "内部级"
    description: "仅限内部使用"
  L3:
    name: "机密级"
    description: "严格限制访问"
  L4:
    name: "绝密级"
    description: "最高级别保护"

# --- FAISS 向量库 ---
faiss:
  index_type: "IVF-Flat"
  vector_dim: 768               # Sentence-BERT 输出维度
  n_list: 64                    # Voronoi 单元数
  n_probe: 8                    # 搜索探测数
  metric: "cosine"              # 距离度量
  max_entries: 10000            # 最大条目数
  query_latency_ms: 2           # 查询延迟

# --- RAG 检索增强 ---
rag:
  k: 3                          # 检索候选数（默认）
  top_p: 0.85                   # Top-p 注意力筛选阈值
  temperature: 1.0              # Softmax 温度参数 τ
  cold_start:
    seed_cases_per_level: [5, 10]  # 每级别种子案例数
    total_seed_cases: [20, 40]     # 总种子案例数

# --- 自洽性校验 ---
self_consistency:
  T: 5                          # MC-Dropout 推理轮次（默认）
  T_range: [1, 3, 5, 7, 9]     # 实验扫描范围
  rho_min: 0.6                  # 一致性比率阈值
  c_min: 0.85                   # 置信度阈值
  gamma: 1.5                    # 不确定性阈值
  gamma_sweep: [1.2, 1.5, 1.8] # 实验扫描范围
  beta: 0.6                     # 熵与方差权衡系数

# --- 敏感资产目录 ---
asset_catalog:
  hash_algorithm: "sha256"
  joint_hash: true              # 内容哈希 ∥ 画像版本号
  update_triggers:
    content_change: true         # 文件内容变更触发
    profile_change: true         # 用户画像版本变更触发
    periodic_patrol:
      enabled: true
      interval_hours: 24         # 巡检周期
      expire_days: 7             # 条目过期天数
  priority_order: ["L4", "L3", "L2", "L1"]  # 重评优先级

# --- 五层结构化提示模板 ---
prompt_template:
  system_role: >
    你是企业数据安全专家，任务是根据上下文判断文件敏感等级(L1-L4)。
    你必须综合考虑文件内容语义、操作用户的角色画像和历史修正案例。
  output_schema:
    format: "json"
    fields: ["level", "category", "reason", "confidence"]

# --- 实验配置 ---
experiment:
  n_folds: 5                    # 交叉验证折数
  significance_test: "mcnemar"  # 显著性检验方法
  significance_alpha: 0.01      # 显著性水平
