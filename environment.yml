name: dlp-profiling
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1

  # 科学计算
  - numpy>=1.24.0
  - scipy>=1.11.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0

  # 向量检索
  - faiss-gpu=1.7.4

  # 可视化
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # 工具
  - pyyaml>=6.0
  - tqdm>=4.66.0
  - pytest>=7.4.0

  # pip 依赖
  - pip:
    - transformers>=4.36.0
    - sentence-transformers>=2.2.2
    - tokenizers>=0.15.0
    - auto-gptq>=0.6.0
    - bitsandbytes>=0.41.0
    - accelerate>=0.25.0
    - optimum>=1.14.0
    - paddlepaddle-gpu>=2.5.0
    - paddleocr>=2.7.0
    - pdf2image>=1.16.3
    - python-docx>=1.1.0
    - openpyxl>=3.1.2
    - Pillow>=10.0.0
    - pymupdf>=1.23.0
    - z3-solver>=4.12.0
    - omegaconf>=2.3.0
    - loguru>=0.7.0
    - tensorboard>=2.14.0
    - pyvelociraptor>=0.1.0
    - grpcio>=1.59.0
    - protobuf>=4.25.0
